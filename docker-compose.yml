version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: sansons_db
    restart: always
    environment:
      MYSQL_DATABASE: pos_db
      MYSQL_ROOT_PASSWORD: Mady7077**
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./enterprise-pos/backend
      dockerfile: Dockerfile
    container_name: sansons_backend
    restart: always
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=Mady7077**
      - DB_NAME=pos_db
      - DB_PORT=3306
    ports:
      - "8888:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sansons_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "9999:80"

volumes:
  mysql_data:
